CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PERIPHERAL=y

# ------------------------------------------------------------
# Bluetooth Mesh
# ------------------------------------------------------------

CONFIG_BT_MESH=y
CONFIG_BT_MESH_PB_ADV=y

# Provisioner
CONFIG_BT_MESH_PROVISIONER=y
CONFIG_BT_MESH_CDB=y
CONFIG_BT_MESH_CFG_CLI=y

# ------------------------------------------------------------
# CDB capacity
# ------------------------------------------------------------

CONFIG_BT_MESH_CDB_NODE_COUNT=4
CONFIG_BT_MESH_CDB_SUBNET_COUNT=1
CONFIG_BT_MESH_CDB_APP_KEY_COUNT=2

# ------------------------------------------------------------
# Mesh crypto
# ------------------------------------------------------------

CONFIG_BT_MESH_USES_TINYCRYPT=y

# ------------------------------------------------------------
# Device
# ------------------------------------------------------------

CONFIG_BT_DEVICE_NAME="A_NRF5340"

# ------------------------------------------------------------
# Console
# ------------------------------------------------------------

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y

# ------------------------------------------------------------
# Stack sizes
# ------------------------------------------------------------

CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ------------------------------------------------------------
# Thread diagnostics
# ------------------------------------------------------------

CONFIG_THREAD_NAME=y
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

# ------------------------------------------------------------
# Mesh provisioning debug
# ------------------------------------------------------------

CONFIG_BT_MESH_PROV_LOG_LEVEL_DBG=y
CONFIG_BT_MESH_PROVISIONER_LOG_LEVEL_DBG=y
CONFIG_BT_MESH_ACCESS_LOG_LEVEL_DBG=y